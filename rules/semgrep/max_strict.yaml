rules:
  # --- Control flow bans (most restrictive set; Norm + JSF + Po10 spirit) ---
  - id: ban-for-loop
    message: "Forbidden: 'for' loops (use simple while with small, explicit bodies)."
    severity: ERROR
    languages: [c, cpp]
    pattern: "for ( ... ) { ... }"

  - id: ban-do-while
    message: "Forbidden: 'do { } while(...)' loops."
    severity: ERROR
    languages: [c, cpp]
    pattern: "do { ... } while ( ... );"

  - id: ban-switch
    message: "Forbidden: 'switch/case' (prefer explicit, small if/else)."
    severity: ERROR
    languages: [c, cpp]
    pattern: "switch ( ... ) { ... }"

  - id: ban-ternary
    message: "Forbidden: ternary operator (?:)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "$X ? $Y : $Z"
      - pattern-regex: "\\?[^:]+:"

  # --- Data layout & macro discipline ---
  - id: ban-union
    message: "Unions are forbidden (type punning/aliasing hazards)."
    severity: ERROR
    languages: [c, cpp]
    pattern: "union $U { ... }"

  - id: ban-pragma
    message: "Forbidden: #pragma (non-portable behavior)."
    severity: ERROR
    languages: [c, cpp]
    pattern: |
      #pragma $ANY

  # --- Pointer arithmetic & increments (approx; clang-tidy also enforces) ---
  - id: ban-pointer-increment
    message: "Forbidden: pointer increment/decrement (pro-bounds-pointer-arithmetic)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "++$P"
      - pattern: "$P++"
      - pattern: "--$P"
      - pattern: "$P--"
      - pattern: "$P += $X"
      - pattern: "$P -= $X"
    paths: { include: ["src/**", "include/**"] }

  # --- Globals: ban mutable globals across src/** (allow const) ---
  - id: src-no-global-mutable
    message: "No global mutable state in src/** (use explicit wiring)."
    severity: ERROR
    languages: [c, cpp]
    patterns:
      - pattern-either:
          - pattern: "int $X"
          - pattern: "long $X"
          - pattern: "char $X"
          - pattern: "$T *$X"
      - pattern-not: const
    paths:
      include: ["src/**"]
      exclude: ["tests/**"]

  # --- Concurrency only in src/concurrency/** ---
  - id: concurrency-outside-module
    message: "Concurrency primitives only allowed in src/concurrency/**."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "pthread_$(...)"
      - pattern: "std::thread $X(...)"
      - pattern: "std::mutex $X"
      - pattern: "std::atomic<$T> $X"
      - pattern: "std::this_thread::sleep_$(...)"
    paths:
      include: ["src/**"]
      exclude: ["src/concurrency/**"]

  # --- Core purity hardening (add no-float) ---
  - id: boundary-no-float-in-core
    message: "No floating-point types in src/core/** (deterministic, fixed-point only)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "float $X"
      - pattern: "double $X"
      - pattern: "long double $X"
    paths: { include: ["src/core/**"] }

  # ─────────────── Additional 'max‑strict' C++ bans ───────────────
  - id: ban-exceptions-in-src
    message: "Exceptions are banned in src/**."
    severity: ERROR
    languages: [cpp]
    pattern-either:
      - pattern: "throw ..."
      - pattern: "try { ... }"
      - pattern: "catch ( ... ) { ... }"
    paths: { include: ["src/**"] }

  - id: ban-rtti-in-src
    message: "RTTI is banned in src/**."
    severity: ERROR
    languages: [cpp]
    pattern-either:
      - pattern: "dynamic_cast<$T>(...)"
      - pattern: "typeid(...)"
    paths: { include: ["src/**"] }

  - id: ban-dangerous-casts
    message: "C-style casts and dangerous casts are banned."
    severity: ERROR
    languages: [cpp]
    pattern-either:
      - pattern: "( $T )$X"
      - pattern: "reinterpret_cast<$T>(...)"
      - pattern: "const_cast<$T>(...)"
    paths: { include: ["src/**"] }

  - id: ban-inline-asm
    message: "Inline assembly is banned."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "asm(...)"
      - pattern: "__asm__(...)"
    paths: { include: ["src/**"] }

  - id: ban-system-spawn
    message: "No system()/popen() in src/**."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "system(...)"
      - pattern: "popen(...)"
    paths: { include: ["src/**"] }

  - id: ban-using-namespace-std
    message: "Do not use 'using namespace std;'."
    severity: ERROR
    languages: [cpp]
    pattern: "using namespace std;"
    paths: { include: ["src/**", "include/**"] }

  # ─────────────── Approximate structural discipline ───────────────
  - id: core-no-global-mutable
    message: "No global mutable state in src/core/**."
    severity: ERROR
    languages: [c, cpp]
    patterns:
      - pattern-either:
          - pattern: "int $X"
          - pattern: "long $X"
          - pattern: "char $X"
          - pattern: "$T *$X"
      - pattern-not: const
    paths: { include: ["src/core/**"] }

  - id: forbid-function-pointers-in-core-approx
    message: "Avoid function pointers in core (prefer explicit interfaces)."
    severity: WARNING
    languages: [c, cpp]
    pattern: "$T (*$FN)(...)"
    paths: { include: ["src/core/**"] }

  - id: boundary-no-assert-in-src
    message: "Do not use assert() in src/** (allow in tests/**). Prefer explicit error handling."
    severity: ERROR
    languages: [c, cpp]
    pattern: "assert(...)"
    paths:
      include: ["src/**"]
      exclude: ["tests/**"]
