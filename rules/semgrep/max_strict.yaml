rules:
  # ───────── High-integrity / verification extras (seL4 + JPL + CERT) ─────────
  - id: ban-incdec-everywhere
    message: "No pre/post ++/-- (verification-friendly, seL4)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "++$X"
      - pattern: "$X++"
      - pattern: "--$X"
      - pattern: "$X--"
    paths: { include: ["src/**", "include/**"] }

  # --- Bounded loops only (Po10 Rule 2): forbid while(true)/unbounded patterns
  - id: max-bounded-loops
    message: "Loops must have a fixed, statically provable upper bound (no while(true)/for(;;))."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: for(;;) { ... }
      - pattern: while(true) { ... }
      - pattern: while(1) { ... }

  - id: ban-break-continue
    message: "Forbidden: break/continue (structured, single-exit loops)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: break;
      - pattern: continue;
    paths: { include: ["src/**"] }

  # --- Control flow bans (most restrictive set; Norm + JSF + Po10 spirit) ---
  - id: ban-for-loop
    message: "Forbidden: 'for' loops (use simple while with small, explicit bodies)."
    severity: ERROR
    languages: [c, cpp]
    pattern: "for ( ... ) { ... }"

  - id: ban-do-while
    message: "Forbidden: 'do { } while(...)' loops."
    severity: ERROR
    languages: [c, cpp]
    pattern: "do { ... } while ( ... );"

  - id: ban-switch
    message: "Forbidden: 'switch/case' (prefer explicit, small if/else)."
    severity: ERROR
    languages: [c, cpp]
    pattern: "switch ( ... ) { ... }"

  - id: ban-ternary
    message: "Forbidden: ternary operator (?:)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "$X ? $Y : $Z"
      - pattern-regex: "\\?[^:]+:"

  - id: ban-setjmp-longjmp
    message: "Do not use setjmp/longjmp."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: setjmp(...)
      - pattern: longjmp(...)

  # --- Ban static local non-consts (hidden global state)
  - id: ban-static-local-nonconst
    message: "No non-const static local variables (hidden state)."
    severity: ERROR
    languages: [c, cpp]
    patterns:
      - pattern: |
          $RET $F(...){
            ...
            static $T $X = $INIT;
            ...
          }
      - pattern-not: const

  # --- Data layout & macro discipline ---
  - id: ban-union
    message: "Unions are forbidden (type punning/aliasing hazards)."
    severity: ERROR
    languages: [c, cpp]
    pattern: "union $U { ... }"

  - id: ban-pragma
    message: "Forbidden: #pragma (non-portable behavior)."
    severity: ERROR
    languages: [c, cpp]
    pattern: |
      #pragma $ANY

  - id: ban-macros-in-src
    message: "No macros in src/** (prefer const/enums/inline)."
    severity: ERROR
    languages: [c, cpp]
    pattern-regex: "^[[:space:]]*#[[:space:]]*define\\b"
    paths: { include: ["src/**"] }

  - id: ban-undef-in-src
    message: "No #undef in src/**."
    severity: ERROR
    languages: [c, cpp]
    pattern-regex: "^[[:space:]]*#[[:space:]]*undef\\b"
    paths: { include: ["src/**"] }

  - id: ban-token-paste
    message: "Token pasting (##) is forbidden."
    severity: ERROR
    languages: [c, cpp]
    pattern-regex: "##"
    paths: { include: ["src/**", "include/**"] }

  - id: ban-ifdef-in-src
    message: "No #ifdef/#ifndef in src/** (reduce configuration variability)."
    severity: ERROR
    languages: [c, cpp]
    pattern-regex: "^[[:space:]]*#[[:space:]]*ifn?def\\b"
    paths: { include: ["src/**"] }

  # --- Pointer arithmetic & increments (approx; clang-tidy also enforces) ---
  - id: ban-pointer-increment
    message: "Forbidden: pointer increment/decrement (pro-bounds-pointer-arithmetic)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "++$P"
      - pattern: "$P++"
      - pattern: "--$P"
      - pattern: "$P--"
      - pattern: "$P += $X"
      - pattern: "$P -= $X"
    paths: { include: ["src/**", "include/**"] }

  # --- Globals: ban mutable globals across src/** (allow const) ---
  - id: src-no-global-mutable
    message: "No global mutable state in src/** (use explicit wiring)."
    severity: ERROR
    languages: [c, cpp]
    patterns:
      - pattern-either:
          - pattern: "int $X"
          - pattern: "long $X"
          - pattern: "char $X"
          - pattern: "$T *$X"
      - pattern-not: const
    paths:
      include: ["src/**"]
      exclude: ["tests/**"]

  # --- Concurrency only in src/concurrency/** ---
  - id: concurrency-outside-module
    message: "Concurrency primitives only allowed in src/concurrency/**."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "pthread_$(...)"
      - pattern: "std::thread $X(...)"
      - pattern: "std::mutex $X"
      - pattern: "std::atomic<$T> $X"
      - pattern: "std::this_thread::sleep_$(...)"
    paths:
      include: ["src/**"]
      exclude: ["src/concurrency/**"]

  # --- Core purity hardening + float ban across src/** ---
  - id: boundary-no-float-in-core
    message: "No floating-point types in src/core/** (deterministic, fixed-point only)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "float $X"
      - pattern: "double $X"
      - pattern: "long double $X"
    paths: { include: ["src/core/**"] }

  - id: boundary-no-float-in-src
    message: "No floating-point types in src/** (project policy)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "float $X"
      - pattern: "double $X"
      - pattern: "long double $X"
    paths: { include: ["src/**"], exclude: ["tests/**"] }

  # ─────────────── Additional 'max-strict' C++ bans ───────────────
  - id: ban-exceptions-in-src
    message: "Exceptions are banned in src/**."
    severity: ERROR
    languages: [cpp]
    pattern-either:
      - pattern: "throw ..."
      - pattern: "try { ... }"
      - pattern: "catch ( ... ) { ... }"
    paths: { include: ["src/**"] }

  - id: ban-rtti-in-src
    message: "RTTI is banned in src/**."
    severity: ERROR
    languages: [cpp]
    pattern-either:
      - pattern: "dynamic_cast<$T>(...)"
      - pattern: "typeid(...)"
    paths: { include: ["src/**"] }

  - id: ban-dangerous-casts
    message: "C-style casts and dangerous casts are banned."
    severity: ERROR
    languages: [cpp]
    pattern-either:
      - pattern: "( $T )$X"
      - pattern: "reinterpret_cast<$T>(...)"
      - pattern: "const_cast<$T>(...)"
    paths: { include: ["src/**"] }

  - id: ban-restrict-in-src
    message: "No 'restrict' in src/** (portability & analysis)."
    severity: ERROR
    languages: [c]
    pattern: restrict
    paths: { include: ["src/**"] }

  - id: ban-inline-asm
    message: "Inline assembly is banned."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: "asm(...)"
      - pattern: "__asm__(...)"
    paths: { include: ["src/**"] }

  - id: boundary-no-assert-in-src
    message: "Do not use assert() in src/** (allow in tests/**). Prefer explicit error handling."
    severity: ERROR
    languages: [c, cpp]
    pattern: "assert(...)"
    paths:
      include: ["src/**"]
      exclude: ["tests/**"]

  # --- Volatile only at hardware boundaries (never in core) ---
  - id: ban-volatile-in-core
    message: "No 'volatile' in src/core/**."
    severity: ERROR
    languages: [c, cpp]
    pattern: volatile
    paths: { include: ["src/core/**"] }
