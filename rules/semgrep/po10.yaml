rules:
  # ─────────────────────────── Power of Ten (safety) ───────────────────────────
  - id: po10-no-goto
    message: "Power of Ten: no goto."
    severity: ERROR
    languages: [c, cpp]
    pattern: goto $X;

  - id: po10-no-recursion
    message: "Power of Ten: no recursion."
    severity: ERROR
    languages: [c, cpp]
    patterns:
      - pattern-inside: |
          $RET $F(...){ ... }
      - pattern: |
          $F(...)

  - id: po10-no-varargs
    message: "Power of Ten: variadic functions are disallowed in safety-critical code."
    severity: ERROR
    languages: [c, cpp]
    pattern: |
      $RET $F(...)

  - id: po10-no-function-like-macro
    message: "Power of Ten: function-like macros are disallowed; use inline/static functions."
    severity: ERROR
    languages: [c, cpp]
    pattern: |
      #define $NAME($ARGS) ...

  - id: po10-no-setjmp-longjmp
    message: "Power of Ten: setjmp/longjmp are disallowed."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: setjmp(...)
      - pattern: longjmp(...)

  - id: po10-no-infinite-loops
    message: "Power of Ten: unbounded loops are disallowed."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: for(;;) { ... }
      - pattern: while(1) { ... }
      - pattern: while(true) { ... }
      - pattern: do { ... } while(1);
      - pattern: do { ... } while(true);

  - id: po10-loop-single
    message: "Power of Ten (project policy): at most one loop per function (heuristic)."
    severity: WARNING
    languages: [c, cpp]
    pattern: |
      $RET $F(...){
        ...
        for ( ... ) { ... }
        ...
        for ( ... ) { ... }
        ...
      }
    # Heuristic; may false-positive—manual review expected.

  - id: po10-no-vla
    message: "Power of Ten: variable length arrays are disallowed."
    severity: ERROR
    languages: [c, cpp]
    pattern-regex: '\[[^]]*[A-Za-z_][^]]*\]'

  # ─────────────────────────── Module boundaries (macro-architecture) ──────────────────
  - id: boundary-no-io-in-core
    message: "No I/O in src/core/** (keep pure)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: printf(...)
      - pattern: fprintf(...)
      - pattern: dprintf(...)
      - pattern: open(...)
      - pattern: read(...)
      - pattern: write(...)
      - pattern: close(...)
      - pattern: fread(...)
      - pattern: fwrite(...)
      - pattern: fopen(...)
      - pattern: fclose(...)
    paths: { include: ["src/core/**"] }

  - id: boundary-no-threads-in-core
    message: "No thread/process primitives in src/core/**."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: pthread_create(...)
      - pattern: pthread_mutex_$(...)
      - pattern: fork(...)
      - pattern: exec$(...)
      - pattern: std::thread $X(...);
      - pattern: std::this_thread::sleep_for(...)
      - pattern: std::this_thread::sleep_until(...)
    paths: { include: ["src/core/**"] }

  - id: boundary-no-rand-time-in-core
    message: "Determinism: no rand/time APIs in src/core/**."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: rand(...)
      - pattern: srand(...)
      - pattern: random(...)
      - pattern: drand48(...)
      - pattern: time(...)
      - pattern: gettimeofday(...)
      - pattern: clock_gettime(...)
      - pattern: arc4random(...)
      - pattern: std::rand(...)
      - pattern: std::random_device(...)
      - pattern: std::chrono::steady_clock::now(...)
      - pattern: std::chrono::system_clock::now(...)
    paths: { include: ["src/core/**"] }

  - id: boundary-no-sleep-in-core
    message: "No sleeping in core (timing side-effects)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: sleep(...)
      - pattern: usleep(...)
      - pattern: nanosleep(...)
      - pattern: std::this_thread::sleep_for(...)
      - pattern: std::this_thread::sleep_until(...)
    paths: { include: ["src/core/**"] }

  - id: boundary-no-mmap-ioctl-in-core
    message: "No direct syscalls like mmap/ioctl in core."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: mmap(...)
      - pattern: munmap(...)
      - pattern: ioctl(...)
    paths: { include: ["src/core/**"] }

  - id: boundary-no-unsafe-c-functions
    message: "Do not use unsafe C functions (gets/strcpy/strcat/sprintf/vsprintf/scanf-family)."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: gets(...)
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
      - pattern: vsprintf(...)
      - pattern: scanf(...)
      - pattern: fscanf(...)
      - pattern: sscanf(...)

  - id: po10-no-heap-after-init
    message: "No dynamic allocation after init; wrap in src/allocator/** only."
    severity: ERROR
    languages: [c, cpp]
    pattern-either:
      - pattern: malloc(...)
      - pattern: calloc(...)
      - pattern: realloc(...)
      - pattern: free(...)
      - pattern: new $T(...)
      - pattern: delete $X
    paths: { exclude: ["src/allocator/**"] }

  # ─────────────── Additional 'max-strict' C++ bans (reiterated) ───────────────
  - id: ban-exceptions-in-src
    message: "Exceptions are banned in src/**."
    severity: ERROR
    languages: [cpp]
    pattern-either:
      - pattern: throw ...
      - pattern: try { ... }
      - pattern: catch ( ... ) { ... }
    paths: { include: ["src/**"] }
