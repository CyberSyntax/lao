# Perfect Max-Strict budgets (10x stricter than 42 Norm; Po10 + JPL + seL4)
# Most restrictive numeric ceilings we can automate locally.
function_lines_max: 10        # <= 10 lines per function body
nesting_max: 1                # flat, reviewable control flow
cyclomatic_max: 2             # extremely small units
duplication_percent_max: 0    # no copy-paste
warnings_as_errors: true
no_recursion: true
no_goto: true
no_varargs: true

# Additional quantitative gates used by tools
params_max: 2                 # <= 2 parameters per function
locals_max: 2                 # <= 2 local (non-const) vars per function (approx)

# clang-tidy detail thresholds (keep strict)
statement_threshold: 20       # ~two dozen simple statements max
branch_threshold: 3           # <= 3 branches inside a function

# Max-Strict extras (read by semgrep / docs; not all auto-enforced)
# loops_max: 1                 # advisory: at most one loop per function
# returns_max: 1               # advisory: single-exit where feasible
